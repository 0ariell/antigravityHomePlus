services:
  postgres:
    image: postgres:16-alpine
    container_name: homeplus-db
    environment:
      POSTGRES_USER: homeplus
      POSTGRES_PASSWORD: homeplus_secret
      POSTGRES_DB: homeplus
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeplus"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
